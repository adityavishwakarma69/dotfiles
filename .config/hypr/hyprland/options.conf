
autogenerated = 0

monitor=,preferred,auto,1.25

xwayland {
  force_zero_scaling = true
}

input {
    kb_layout = us

    follow_mouse = 1
    force_no_accel = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $color15
    col.inactive_border = $color1

    layout = dwindle

    allow_tearing = true
}

decoration {
    rounding = 0
    
    blur {
        enabled = false
        size = 5
        passes = 2
    }

}

animations {
    enabled = yes
    bezier = myBezier, 0.42, 0, 0.58, 1, 
    bezier = overshoot, 0.05, 0.9, 0.1, 1.3

    animation = windows, 1, 5, default, gnomed
    animation = layers, 1, 7, default, fade
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, overshoot, slidevert
}

dwindle {
    pseudotile = yes
    preserve_split = yes
    split_bias = 1
    permanent_direction_override = 1
}

gestures {
    workspace_swipe = off
}

misc { 
    vfr = true
    enable_swallow = true
    swallow_regex = ^(foot|footclient)
}
